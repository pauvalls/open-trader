[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2 --proxy-headers'"
healthcheckPath = "/health/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.envVars]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
API_HOST = "0.0.0.0"
API_PORT = "$PORT"
DEBUG = "false"
DATABASE_URL = "sqlite+aiosqlite:///./data/paper_trading.db"

# Secrets (set these in Railway dashboard):
# - SECRET_KEY
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_CHAT_ID
# - DISCORD_WEBHOOK_URL
